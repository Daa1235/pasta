<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POKEMON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header id="top">
        <div class="Ptext">
            <h1>Pokédex</h1>
            <p>Find and discover everything about Pokemons.</p>
        </div>
    </header>
<nav aria-label="Pesquisa e filtros da Pokédex">
    <section class="Filter" aria-label="Filtrar Pokémon">
        <label class="field grow">
            <span>Pokémon</span>
            <input id="search" type="search" placeholder="Nome ou número">
        </label>

        <label class="field">
            <span>Geração</span>
            <select id="gen">
                <option value="all">Todas</option>
                <option value="1">I · Kanto</option>
                <option value="2">II · Johto</option>
                <option value="3">III · Hoenn</option>
                <option value="4">IV · Sinnoh</option>
                <option value="5">V · Unova</option>
                <option value="6">VI · Kalos</option>
                <option value="7">VII · Alola</option>
                <option value="8">VIII · Galar</option>
                <option value="9">IX · Paldea</option>
            </select>
        </label>

        <label class="field">
            <span>Tipo</span>
            <select id="type"><option value="all">Todos</option></select>
        </label>
    </section>
</nav>
    <main>
        <div id="grid" aria-live="polite"></div>
    </main>

    <dialog id="info" aria-label="Pokémon details"></dialog>

    <a class="back-to-top" href="#top" aria-label="Voltar ao topo">↑</a>

    <!-- Áudio oculto e em loop -->
    <audio id="musica" src="m.mp3" loop autoplay></audio>
    <script src="script.js"></script>
    <script>
        const musica = document.getElementById('musica');
        musica.volume = 0.3;

        // Tenta tocar imediatamente ao abrir a página
        musica.play().catch(() => {
            // Se o navegador bloquear o autoplay, toca no primeiro clique em qualquer sítio do site
            document.addEventListener('click', () => {
                musica.play();
            }, { once: true });
        });
    </script>
</body>
</html>
